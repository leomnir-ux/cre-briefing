<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRE Weekly Briefing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="masthead">
      <h1 id="title">U.S. CRE Weekly Briefing</h1>
      <div class="dateline">
        <span id="week-range"></span>
        <label class="week-picker" id="week-picker">
          <span class="label-text">Other weeks</span>
          <select id="week"></select>
        </label>
      </div>
    </div>
    <nav id="sections" class="buttons" aria-label="Sections"></nav>
  </header>

  <main id="content"></main>

  <script src="briefings-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
